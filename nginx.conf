server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 텍스트 파일을 압축해서 보내 화면이 더 빨리 뜨게 한다
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 쿠버네티스가 "Nginx 살아 있니?" 하고 물어보는 주소
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # 빌드 결과물(JS/CSS)은 파일 이름에 해시가 붙어 있어서 오래 캐시해도 안전하다
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html은 캐시하지 않는다 → 새로 배포하면 바로 새 화면이 보인다
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # React Router 대응: 없는 파일 주소(/login, /settlements 등)는 index.html을 보내
    # React가 화면을 그리게 한다. 이게 없으면 새로고침 시 404가 난다.
    location / {
        try_files $uri $uri/ /index.html;
    }
}